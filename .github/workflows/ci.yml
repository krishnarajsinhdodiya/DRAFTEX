name: CI

on:
  push:
    branches: ["main", "phase/**", "chore/**", "fix/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  commit-hygiene:
    name: commit-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check author, committer and messages of every commit
        run: node scripts/commit-hygiene.mjs --range "${{ github.event.pull_request.head.sha || github.sha }}"

  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Create the data folder
        run: node scripts/ci-data-dir.mjs
      - name: Cache the LaTeX engine and package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/draftex-data/tools
          key: tectonic-0.17.0-6ffe0558-${{ runner.os }}-${{ hashFiles('src/lib/latex/warmup.ts', 'src/lib/latex/pins.ts') }}
          restore-keys: tectonic-0.17.0-6ffe0558-${{ runner.os }}-
      - name: Install Tectonic and warm the package cache
        run: npm run setup:tectonic
      - name: Golden compile, visual regression and fuzz
        run: npm run test:golden
      - name: Render candidate visual baselines
        if: failure() && runner.os == 'Linux'
        run: npm run test:golden -- tests/golden/visual.test.ts
        env:
          UPDATE_BASELINES: "1"
      - name: Upload golden results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-${{ matrix.os }}
          path: |
            test-results/golden/
            tests/golden/baselines/
          retention-days: 7
      - name: Install Playwright browser
        run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          retention-days: 7
